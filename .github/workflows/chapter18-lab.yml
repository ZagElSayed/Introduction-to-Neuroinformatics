name: Chapter 18 static source checks
on:
  push:
    paths: ['chapters/ch18-vision-ai/**', '.github/workflows/chapter18-lab.yml']
  pull_request:
    paths: ['chapters/ch18-vision-ai/**', '.github/workflows/chapter18-lab.yml']
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse Python and unexecuted notebooks without running labs
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          root = Path('chapters/ch18-vision-ai')
          for path in root.glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          for path in root.joinpath('notebooks').glob('*.ipynb'):
              notebook = json.loads(path.read_text())
              assert notebook['nbformat'] == 4
              for i, cell in enumerate(notebook['cells']):
                  if cell['cell_type'] != 'code':
                      continue
                  assert cell['execution_count'] is None and not cell['outputs']
                  lines = ''.join(cell['source']).splitlines()
                  source = '\n'.join(line for line in lines if not line.lstrip().startswith('%pip '))
                  ast.parse(source, filename=f'{path}:cell{i}')
          print('Static checks only; no data downloads, training, lab tests, or notebook execution.')
          PY
