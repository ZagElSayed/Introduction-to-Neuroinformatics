name: Chapter 18 representation audit laboratory
on:
  push:
    paths: ['chapters/ch18-vision-ai/**', 'tests/test_chapter18_lab.py', '.github/workflows/chapter18-lab.yml']
  pull_request:
    paths: ['chapters/ch18-vision-ai/**', 'tests/test_chapter18_lab.py', '.github/workflows/chapter18-lab.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'Pillow>=10,<13'
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_chapter18_lab.py
      - run: python chapters/ch18-vision-ai/exercise_18_1_render_audit.py --config chapters/ch18-vision-ai/config.json --output-dir outputs/ch18
