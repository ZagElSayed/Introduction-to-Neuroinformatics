name: Chapter 14 inverse modeling lab checks

on:
  push:
    paths:
      - 'chapters/ch14-source-localization/**'
      - 'tests/test_chapter14_lab.py'
      - '.github/workflows/chapter14-lab.yml'
  pull_request:
    paths:
      - 'chapters/ch14-source-localization/**'
      - 'tests/test_chapter14_lab.py'
      - '.github/workflows/chapter14-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Chapter 14 source inverse checks
        run: python -m pytest -q tests/test_chapter14_lab.py
