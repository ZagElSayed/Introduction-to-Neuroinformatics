name: Chapter 7 wearable lab checks

on:
  push:
    paths:
      - 'chapters/ch07-wearables/**'
      - 'tests/test_chapter7_lab.py'
      - 'tests/test_chapter7_remote_monitoring.py'
      - 'requirements.txt'
      - '.github/workflows/chapter7-lab.yml'
  pull_request:
    paths:
      - 'chapters/ch07-wearables/**'
      - 'tests/test_chapter7_lab.py'
      - 'requirements.txt'
      - '.github/workflows/chapter7-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test synthetic ECG, IMU, timeline and QC
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests/test_chapter7_lab.py tests/test_chapter7_remote_monitoring.py
