name: Chapter 11 governance lab checks

on:
  push:
    paths:
      - 'chapters/ch11-ethics-governance/**'
      - 'tests/test_chapter11_lab.py'
      - '.github/workflows/chapter11-lab.yml'
  pull_request:
    paths:
      - 'chapters/ch11-ethics-governance/**'
      - 'tests/test_chapter11_lab.py'
      - '.github/workflows/chapter11-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run governance policy checks
        run: python -m pytest -q tests/test_chapter11_lab.py
