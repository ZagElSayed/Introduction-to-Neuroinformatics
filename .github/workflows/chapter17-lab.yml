name: Chapter 17 deep learning laboratory
on:
  push:
    paths: ['chapters/ch17-deep-learning/**', 'tests/test_chapter17_lab.py', '.github/workflows/chapter17-lab.yml']
  pull_request:
    paths: ['chapters/ch17-deep-learning/**', 'tests/test_chapter17_lab.py', '.github/workflows/chapter17-lab.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_chapter17_lab.py
      - run: python chapters/ch17-deep-learning/exercise_17_1_deep_pipeline.py --config chapters/ch17-deep-learning/config.json --output-dir outputs/ch17
