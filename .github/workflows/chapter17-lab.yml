name: Chapter 17 static teaching-source checks
on:
  workflow_dispatch:
  push:
    paths: ['chapters/ch17-deep-learning/**', 'tests/test_chapter17_lab.py', '.github/workflows/chapter17-lab.yml']
  pull_request:
    paths: ['chapters/ch17-deep-learning/**', 'tests/test_chapter17_lab.py', '.github/workflows/chapter17-lab.yml']
permissions:
  contents: read
jobs:
  static-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse source without running labs or notebooks
        run: |
          python - <<'PYCODE'
          import ast
          import json
          from pathlib import Path
          root = Path('chapters/ch17-deep-learning')
          for source in [*root.glob('*.py'), Path('tests/test_chapter17_lab.py')]:
              ast.parse(source.read_text(), filename=str(source))
          json.loads((root/'config.json').read_text())
          notebooks = sorted((root/'notebooks').glob('*.ipynb'))
          assert len(notebooks) == 5
          for path in notebooks:
              notebook = json.loads(path.read_text())
              assert notebook['nbformat'] == 4
              for cell in notebook['cells']:
                  source = cell['source']
                  source = ''.join(source) if isinstance(source, list) else source
                  if cell['cell_type'] == 'code':
                      ast.parse(source, filename=str(path))
                      assert cell['execution_count'] is None and cell['outputs'] == []
          print('Static parsing only; no notebook or lab execution.')
          PYCODE
