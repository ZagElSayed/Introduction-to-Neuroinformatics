name: Chapter 15 graph lab checks

on:
  push:
    paths:
      - 'chapters/ch15-brain-networks/**'
      - 'tests/test_chapter15_lab.py'
      - '.github/workflows/chapter15-lab.yml'
  pull_request:
    paths:
      - 'chapters/ch15-brain-networks/**'
      - 'tests/test_chapter15_lab.py'
      - '.github/workflows/chapter15-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Chapter 15 graph tests
        run: python -m pytest -q tests/test_chapter15_lab.py
