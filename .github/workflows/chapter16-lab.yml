name: Chapter 16 static source checks
on:
  workflow_dispatch:
  push:
    paths: ['chapters/ch16-classical-ml/**', 'tests/test_chapter16_lab.py', '.github/workflows/chapter16-lab.yml']
  pull_request:
    paths: ['chapters/ch16-classical-ml/**', 'tests/test_chapter16_lab.py', '.github/workflows/chapter16-lab.yml']
permissions:
  contents: read
jobs:
  static-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse source and configuration without executing the lab
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          root = Path('chapters/ch16-classical-ml')
          for source in [*root.glob('*.py'), Path('tests/test_chapter16_lab.py')]:
              ast.parse(source.read_text(encoding='utf-8'), filename=str(source))
          config = json.loads((root / 'config.json').read_text(encoding='utf-8'))
          assert set(config) == {'seed', 'participants', 'repeats', 'outer_folds', 'inner_folds', 'signal', 'fingerprint_scale'}
          for name in ('README.md', 'ASSIGNMENT.md', 'SUBMISSION_TEMPLATE.md',
                       'FIRST_MODEL.md', 'FIRST_STEPS.md', 'MED_NEURO_WALKTHROUGH.md',
                       'REAL_DATA_PROTOCOL.md', 'requirements-lab.txt'):
              assert (root / name).is_file(), name
          print('Static parsing passed; no lab or runtime tests executed.')
          PY
