name: Chapter 9 neurodata standards lab checks

on:
  push:
    paths:
      - 'chapters/ch09-data-standards/**'
      - 'tests/test_chapter9_lab.py'
      - '.github/workflows/chapter9-lab.yml'
  pull_request:
    paths:
      - 'chapters/ch09-data-standards/**'
      - 'tests/test_chapter9_lab.py'
      - '.github/workflows/chapter9-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify neurodata metadata and provenance
        run: python -m pytest -q tests/test_chapter9_lab.py
