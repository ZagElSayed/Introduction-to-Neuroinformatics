name: Chapter 9 neurodata standards lab checks

on:
  push:
    paths:
      - 'chapters/ch09-data-standards/**'
      - 'tests/test_chapter9_lab.py'
      - '.github/workflows/chapter9-lab.yml'
  pull_request:
    paths:
      - 'chapters/ch09-data-standards/**'
      - 'tests/test_chapter9_lab.py'
      - '.github/workflows/chapter9-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify neurodata metadata and provenance
        run: python -m unittest discover -s tests -p test_chapter9_lab.py -v
      - name: Build and revalidate the baseline
        run: |
          python chapters/ch09-data-standards/exercise_9_1_neurodata_contract.py --output-dir outputs/ch09
          python chapters/ch09-data-standards/exercise_9_1_neurodata_contract.py --output-dir outputs/ch09 --validate-only
      - name: Detect all isolated failure examples
        run: python chapters/ch09-data-standards/exercise_9_2_validation_layers.py --output-dir outputs/ch09-failures
      - name: Retain teaching evidence
        uses: actions/upload-artifact@v4
        with:
          name: chapter9-teaching-evidence
          path: outputs/ch09*

