name: Chapter 12 preprocessing lab checks

on:
  push:
    paths:
      - 'chapters/ch12-preprocessing/**'
      - 'tests/test_chapter12_lab.py'
      - '.github/workflows/chapter12-lab.yml'
  pull_request:
    paths:
      - 'chapters/ch12-preprocessing/**'
      - 'tests/test_chapter12_lab.py'
      - '.github/workflows/chapter12-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Chapter 12 lab
        run: python -m pytest -q tests/test_chapter12_lab.py
